<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">VELOX — Performance Redefined</title>
  <desc id="d">Animated banner: an extruded VELOX wordmark above a moving 3D perspective grid with light streaks, and the live site address velox-car-ad.vercel.app.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0b0a08"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a84c" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#c9a84c" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#c9a84c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bdb6a6"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1400 0; 1400 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="floorClip"><rect x="0" y="262" width="1280" height="178"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hline { stroke: #c9a84c; stroke-width: 1; animation: approach 3.2s linear infinite; transform-box: view-box; transform-origin: 640px 262px; opacity: 0; }
      @keyframes approach {
        0%   { transform: scaleY(0.001); opacity: 0; }
        15%  { opacity: 0.55; }
        100% { transform: scaleY(1); opacity: 0.9; }
      }
      .vline { stroke: #c9a84c; stroke-opacity: 0.32; stroke-width: 1; }
      .streak { animation: fly 3.6s cubic-bezier(.55,0,.25,1) infinite; opacity: 0; }
      @keyframes fly {
        0% { transform: translateX(-520px); opacity: 0; }
        12% { opacity: 1; }
        70% { opacity: 1; }
        100% { transform: translateX(1500px); opacity: 0; }
      }
      .word { animation: float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float {
        0%, 100% { transform: translateY(0) skewX(0deg); }
        50% { transform: translateY(-6px) skewX(-2deg); }
      }
      .dot { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .eyebrow { font: 300 13px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 9px; fill: rgba(255,255,255,0.45); }
      .wordmark { font: 400 132px Georgia, 'Times New Roman', serif; letter-spacing: 38px; }
      .model { font: 700 15px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 4px; }
      .url { font: 600 17px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1.5px; fill: #fff; }
      .live { font: 700 12px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #0b0b0b; }
      @media (prefers-reduced-motion: reduce) { .hline, .streak, .word, .dot { animation: none; opacity: 0.6; } }
    </style>
  </defs>

  <rect width="1280" height="440" fill="url(#sky)"/>
  <ellipse cx="640" cy="262" rx="720" ry="150" fill="url(#horizonGlow)"/>

  <!-- 3D perspective floor: rays converge on the vanishing point, rows rush toward the viewer -->
  <g clip-path="url(#floorClip)">
    <g class="vline">
      <line x1="640" y1="262" x2="-1400" y2="440"/><line x1="640" y1="262" x2="-900" y2="440"/>
      <line x1="640" y1="262" x2="-520" y2="440"/><line x1="640" y1="262" x2="-220" y2="440"/>
      <line x1="640" y1="262" x2="40" y2="440"/><line x1="640" y1="262" x2="270" y2="440"/>
      <line x1="640" y1="262" x2="470" y2="440"/><line x1="640" y1="262" x2="640" y2="440"/>
      <line x1="640" y1="262" x2="810" y2="440"/><line x1="640" y1="262" x2="1010" y2="440"/>
      <line x1="640" y1="262" x2="1240" y2="440"/><line x1="640" y1="262" x2="1500" y2="440"/>
      <line x1="640" y1="262" x2="1800" y2="440"/><line x1="640" y1="262" x2="2180" y2="440"/>
      <line x1="640" y1="262" x2="2680" y2="440"/>
    </g>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:0s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-0.4s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-0.8s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-1.2s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-1.6s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-2.0s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-2.4s"/>
    <line class="hline" x1="0" y1="440" x2="1280" y2="440" style="animation-delay:-2.8s"/>
    <rect x="0" y="262" width="1280" height="178" fill="url(#floorFade)"/>
  </g>
  <line x1="0" y1="262" x2="1280" y2="262" stroke="#c9a84c" stroke-opacity="0.6"/>

  <!-- Light streaks (echo of the site's hero shader) -->
  <g filter="url(#glow)">
    <rect class="streak" x="0" y="196" width="420" height="2" rx="1" fill="url(#streak)" style="animation-delay:-0.3s"/>
    <rect class="streak" x="0" y="228" width="300" height="1.5" rx="1" fill="url(#streak)" style="animation-delay:-1.4s"/>
    <rect class="streak" x="0" y="246" width="520" height="2.5" rx="1" fill="url(#streak)" style="animation-delay:-2.2s"/>
    <rect class="streak" x="0" y="214" width="240" height="1.2" rx="1" fill="url(#streak)" style="animation-delay:-3.0s"/>
  </g>

  <text class="eyebrow" x="640" y="62" text-anchor="middle">PERFORMANCE · INNOVATION · LEGACY</text>

  <!-- Extruded 3D wordmark: stacked depth layers, lit face, moving specular sweep -->
  <g class="word">
    <g class="wordmark" text-anchor="middle">
      <text x="659" y="207" fill="#1a1712">VELOX</text>
      <text x="657" y="205" fill="#221e17">VELOX</text>
      <text x="655" y="203" fill="#2c271e">VELOX</text>
      <text x="653" y="201" fill="#373026">VELOX</text>
      <text x="651" y="199" fill="#433b2e">VELOX</text>
      <text x="649" y="197" fill="#5a4e38">VELOX</text>
      <text x="647" y="195" fill="#7a6a45">VELOX</text>
      <text x="645" y="193" fill="#a08a4f">VELOX</text>
      <text x="643" y="191" fill="url(#face)">VELOX</text>
      <text x="643" y="191" fill="url(#sweep)">VELOX</text>
    </g>
  </g>

  <!-- Models -->
  <g text-anchor="middle">
    <text class="model" x="476" y="312" fill="#c9a84c">◆ GT-X</text>
    <text class="model" x="640" y="312" fill="#e8003d">◆ RS1</text>
    <text class="model" x="804" y="312" fill="#a855f7">◆ LX1</text>
  </g>

  <!-- Live URL pill -->
  <g transform="translate(640 372)">
    <rect x="-232" y="-24" width="464" height="48" rx="24" fill="#0e0e0e" stroke="#c9a84c" stroke-opacity="0.8"/>
    <rect x="-220" y="-14" width="78" height="28" rx="14" fill="#c9a84c"/>
    <circle class="dot" cx="-206" cy="0" r="4.5" fill="#e8003d"/>
    <text class="live" x="-171" y="4.5" text-anchor="middle">LIVE</text>
    <text class="url" x="42" y="6" text-anchor="middle">velox-car-ad.vercel.app  ↗</text>
  </g>
</svg>
